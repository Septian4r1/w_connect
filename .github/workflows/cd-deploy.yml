name: "Laravel CD - Deploy to Hostinger (Zero Downtime)"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: "🚀 CD: Deploy Laravel Zero Downtime"
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1️⃣ Checkout Repository
      # =========================================================
      # Mengambil source code terbaru dari GitHub Actions runner
      # =========================================================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      # =========================================================
      # 2️⃣ Test SSH Connection
      # =========================================================
      # Memastikan koneksi SSH ke server Hostinger berhasil
      # =========================================================
      - name: "🔗 Test SSH Connection"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            echo "✅ Connected from GitHub Actions"

      # =========================================================
      # 3️⃣ Deploy Laravel Application
      # =========================================================
      - name: "🚀 Deploy Laravel App"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          command_timeout: 60m
          script_stop: true
          debug: true

          script: |

            set -e

            echo "================================================="
            echo "🚀 STARTING LARAVEL DEPLOYMENT"
            echo "================================================="

            # =====================================================
            # 📁 PATH CONFIGURATION
            # =====================================================
            DOMAIN_PATH=/home/u595038546/domains/csr.majubersamaadp.com

            CURRENT_PATH=$DOMAIN_PATH/current
            SHARED_PATH=$DOMAIN_PATH/shared
            RELEASES_PATH=$DOMAIN_PATH/releases

            TIMESTAMP=$(date +"%Y%m%d%H%M%S")
            NEW_RELEASE=$RELEASES_PATH/release_$TIMESTAMP

            echo "📁 DOMAIN_PATH: $DOMAIN_PATH"
            echo "📁 CURRENT_PATH: $CURRENT_PATH"

            # =====================================================
            # 📁 CREATE REQUIRED DIRECTORIES
            # =====================================================
            echo "📁 Creating required directories..."

            mkdir -p $RELEASES_PATH

            mkdir -p $SHARED_PATH/storage/framework/cache
            mkdir -p $SHARED_PATH/storage/framework/sessions
            mkdir -p $SHARED_PATH/storage/framework/views

            mkdir -p $SHARED_PATH/storage/app/public
            mkdir -p $SHARED_PATH/bootstrap/cache

            mkdir -p $SHARED_PATH/frontend/data_warga/kk
            mkdir -p $SHARED_PATH/frontend/data_warga/ktp

            echo "✅ Directories ready"

            # =====================================================
            # 📥 FIRST DEPLOY OR FAST PULL
            # =====================================================
            echo "📥 Preparing source code..."

            if [ ! -d "$CURRENT_PATH/.git" ]; then

              echo "📥 First deployment detected"

              git clone git@github.com:Septian4r1/w_connect.git $CURRENT_PATH

            else

              echo "⚡ Existing deployment detected"

              cd $CURRENT_PATH

              # ===================================================
              # CLEAN OLD FILES
              # ===================================================
              # Penting untuk menghindari:
              # "untracked working tree files would be overwritten"
              # ===================================================

              echo "🧹 Cleaning old git files..."

              git fetch origin main

              git reset --hard origin/main

              git clean -fd

              echo "✅ Git cleanup completed"

              # ===================================================
              # PULL LATEST CODE
              # ===================================================

              echo "📥 Pulling latest code..."

              git pull origin main

              echo "✅ Latest code pulled"

            fi

            cd $CURRENT_PATH

            # =====================================================
            # 🧹 REMOVE DUPLICATE / OLD FILES
            # =====================================================
            # Menghindari PSR-4 duplicate issue
            # =====================================================

            echo "🧹 Removing duplicate old files..."

            rm -rf app/mail || true
            rm -f app/Models/Userotp.php || true

            echo "✅ Duplicate cleanup done"

            # =====================================================
            # 🔐 ENVIRONMENT FILE
            # =====================================================

            echo "🔐 Preparing environment file..."

            if [ ! -f $SHARED_PATH/.env ]; then
              cp .env.example $SHARED_PATH/.env
            fi

            rm -f .env
            ln -sfn $SHARED_PATH/.env .env

            echo "✅ Environment ready"

            # =====================================================
            # 🔗 STORAGE SYMLINKS
            # =====================================================

            echo "🔗 Creating symlinks..."

            rm -rf storage
            ln -sfn $SHARED_PATH/storage storage

            mkdir -p frontend

            rm -rf frontend/data_warga
            ln -sfn $SHARED_PATH/frontend/data_warga frontend/data_warga

            echo "✅ Symlinks created"

            # =====================================================
            # 🛡️ ENSURE BOOTSTRAP CACHE EXISTS
            # =====================================================

            mkdir -p bootstrap/cache
            touch bootstrap/cache/.gitignore

            chmod -R 775 storage bootstrap/cache || true

            echo "✅ bootstrap/cache ready"

            # =====================================================
            # 📦 COMPOSER INSTALL
            # =====================================================

            echo "📦 Installing composer dependencies..."

            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction

            echo "✅ Composer install completed"

            # =====================================================
            # 🔍 CHECK PSR-4 WARNINGS
            # =====================================================

            echo "🔍 Checking PSR-4 compliance..."

            PSR4_ERRORS=$(composer dump-autoload -o 2>&1 | grep "does not comply with PSR-4" || true)

            if [ -n "$PSR4_ERRORS" ]; then

              echo "⚠️ PSR-4 warnings detected"
              echo "$PSR4_ERRORS"

              echo "$PSR4_ERRORS" > $SHARED_PATH/psr4_warnings.log

            else

              echo "✅ No PSR-4 warnings"

            fi

            # =====================================================
            # 🧹 CLEAR OLD CACHE
            # =====================================================

            echo "🧹 Clearing old Laravel caches..."

            php artisan optimize:clear || true

            php artisan queue:restart || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan cache:clear || true

            echo "✅ Cache cleared"

            # =====================================================
            # 🔑 GENERATE APP KEY IF EMPTY
            # =====================================================

            if ! grep -q "^APP_KEY=base64:" .env; then

              echo "🔑 APP_KEY missing, generating..."

              php artisan key:generate --force

            fi

            # =====================================================
            # 📈 RUN DATABASE MIGRATIONS
            # =====================================================

            echo "📈 Running database migrations..."

            php artisan migrate --force

            echo "✅ Migration completed"

            # =====================================================
            # ⚡ BUILD LARAVEL CACHE
            # =====================================================

            echo "⚡ Building Laravel caches..."

            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true

            echo "✅ Cache build completed"

            # =====================================================
            # 🔗 STORAGE LINK
            # =====================================================

            echo "🔗 Creating Laravel storage link..."

            php artisan storage:link || true

            echo "✅ Storage link ready"

            # =====================================================
            # 🌐 UPDATE PUBLIC_HTML
            # =====================================================

            echo "🌐 Updating public_html..."

            rm -rf $DOMAIN_PATH/public_html

            ln -sfn $CURRENT_PATH/public $DOMAIN_PATH/public_html

            echo "🟢 Zero downtime deployment completed"

            # =====================================================
            # 🗑️ CLEAN OLD RELEASES
            # =====================================================

            echo "🗑️ Cleaning old releases..."

            cd $RELEASES_PATH

            ls -dt release_* 2>/dev/null | tail -n +3 | xargs rm -rf || true

            echo "✅ Old releases cleaned"

            # =====================================================
            # ✅ FINISHED
            # =====================================================

            echo "================================================="
            echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "================================================="
