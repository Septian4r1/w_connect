name: "Laravel CD - Deploy to Hostinger (Zero Downtime)"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: "🚀 CD: Deploy Laravel Zero Downtime"
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 1️⃣ Checkout Repository
      # ==============================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v3

      # ==============================
      # 2️⃣ Test SSH Connection
      # ==============================
      - name: "🔗 Test SSH Connection"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script: echo "✅ Connected from GitHub Actions"

      # ==============================
      # 3️⃣ Deploy via SSH
      # ==============================
      - name: "🔐 Deploy via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          command_timeout: 30m
          script_stop: false
          debug: true
          script: |
            set -e
            echo "🚀 Starting Deployment..."

            # ==============================
            # Paths & Release Timestamp
            # ==============================
            DOMAIN_PATH=/home/u595038546/domains/csr.majubersamaadp.com
            RELEASES_PATH=$DOMAIN_PATH/releases
            SHARED_PATH=$DOMAIN_PATH/shared
            CURRENT_PATH=$DOMAIN_PATH/current
            TIMESTAMP=$(date +"%Y%m%d%H%M%S")
            NEW_RELEASE=$RELEASES_PATH/release_$TIMESTAMP

            # ==============================
            # Ensure Directories Exist
            # ==============================
            mkdir -p $RELEASES_PATH
            mkdir -p $SHARED_PATH/storage/framework/{sessions,views,cache}
            mkdir -p $SHARED_PATH/storage/app/public
            mkdir -p $SHARED_PATH/bootstrap/cache
            mkdir -p $SHARED_PATH/frontend/data_warga/{kk,ktp}

            # ==============================
            # Deploy Code: Clone or Pull
            # ==============================
            if [ ! -d "$CURRENT_PATH/.git" ]; then
              echo "📥 First deployment - cloning repository"
              git clone git@github.com:Septian4r1/w_connect.git $CURRENT_PATH
            else
              echo "⚡ Fast deploy - pulling latest code"
              cd $CURRENT_PATH
              git reset --hard
              git pull origin main
            fi

            cd $CURRENT_PATH

            # ==============================
            # Environment File
            # ==============================
            if [ ! -f $SHARED_PATH/.env ]; then
              cp .env.example $SHARED_PATH/.env
            fi
            ln -sfn $SHARED_PATH/.env .env
            echo "✅ Environment file ready"

            # ==============================
            # Symlinks: Storage & Data Warga
            # ==============================
            echo "🔗 Creating symlinks..."
            rm -rf storage
            ln -sfn $SHARED_PATH/storage storage

            mkdir -p frontend
            rm -rf frontend/data_warga
            ln -sfn $SHARED_PATH/frontend/data_warga frontend/data_warga

            chmod -R 775 storage bootstrap/cache || true
            echo "✅ Symlinks ready"

            # ==============================
            # Composer Install
            # ==============================
            echo "📦 Installing composer dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts || true

            # ==============================
            # Detect PSR-4 Errors
            # ==============================
            echo "🔍 Checking for PSR-4 autoloading issues..."
            PSR4_ERRORS=$(composer dump-autoload -o 2>&1 | grep "does not comply with PSR-4" || true)
            if [ -n "$PSR4_ERRORS" ]; then
              echo "⚠️ PSR-4 Warnings found:"
              echo "$PSR4_ERRORS"
              echo "$PSR4_ERRORS" > $SHARED_PATH/psr4_warnings.log
            else
              echo "✅ No PSR-4 errors detected"
            fi

            # ==============================
            # Clear Queues & Cache
            # ==============================
            echo "🧹 Clearing queues & caches..."
            php artisan queue:restart || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true

            # ==============================
            # Run Migrations with Safe Rollback
            # ==============================
            echo "📈 Running migrations..."
            PREVIOUS_RELEASE=$(ls -dt $RELEASES_PATH/release_* | sed -n '2p' || echo "")
            if ! php artisan migrate --force; then
              echo "⚠️ Migration failed!"
              if [ -n "$PREVIOUS_RELEASE" ]; then
                echo "🔙 Rolling back to previous release: $PREVIOUS_RELEASE"
                ln -sfn $PREVIOUS_RELEASE $CURRENT_PATH
                ln -sfn $CURRENT_PATH/public $DOMAIN_PATH/public_html
              else
                echo "❌ No previous release to rollback!"
              fi
              exit 1
            fi

            # ==============================
            # Cache Build
            # ==============================
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true

            # ==============================
            # Laravel Storage Link
            # ==============================
            php artisan storage:link || true

            # ==============================
            # Update Public HTML (Zero Downtime)
            # ==============================
            rm -rf $DOMAIN_PATH/public_html
            ln -sfn $CURRENT_PATH/public $DOMAIN_PATH/public_html
            echo "🟢 Site updated with zero downtime"

            # ==============================
            # Cleanup Old Releases (Keep 2)
            # ==============================
            cd $RELEASES_PATH
            ls -dt release_* | tail -n +3 | xargs rm -rf || true
            echo "🗑️ Old releases cleanup done"

            echo "✅ Deployment Completed Successfully!"
